; ============================================================
;  Desk Buddy - ESP32-C3 Desktop Companion Robot
;  Build    : pio run
;  USB flash: pio run -t upload     (needed ONE more time - see README "OTA")
;  OTA flash: tools\ota_update.bat  (wireless, after that last USB flash)
;  Monitor  : pio device monitor
;  Your WiFi name/password + the OTA password go in
;  include/wifi_credentials.h (git-ignored - never committed).
; ============================================================
[env:esp32c3]
; OFFICIAL PlatformIO platform, pinned to the version that built for you.
; Do NOT replace this with a pioarduino URL: that platform needs a ~200 MB
; framework download which silently fails on some PCs and then crashes with
; "TypeError: argument should be a str or an os.PathLike ... NoneType".
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; TWO app slots (ota_0 + ota_1, ~1.9 MB each) so firmware can be flashed over
; WiFi. The old huge_app.csv had ONE big slot - no second slot, no OTA. This
; project keeps its data in NVS (not in a filesystem), so the small spiffs
; partition costs nothing. Changing the partition layout only works over USB,
; which is why the update to v3.15 was the LAST cable flash.
board_build.partitions = min_spiffs.csv
lib_deps =
    olikraus/U8g2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Why no `upload_protocol = espota` section here: on this platform PIO builds
; the espota command line itself and IGNORES upload_flags, so the OTA password
; can never be passed through platformio.ini (and must not be committed anyway).
; tools\ota_update.bat reads OTA_PASSWORD from include/wifi_credentials.h and
; calls the same uploader (espota.py) directly. No-cable fallback: open
; http://deskbuddy.local:8080 in any browser and upload firmware.bin.
