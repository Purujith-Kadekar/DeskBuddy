; ============================================================
;  Desk Buddy - ESP32-C3 Desktop Companion Robot
;  Build   : pio run
;  Upload  : pio run -t upload
;  Monitor : pio device monitor
;  Your WiFi name/password go in include/config.h (top of file).
; ============================================================
[env:esp32c3]
; OFFICIAL PlatformIO platform, pinned to the version that built for you.
; Do NOT replace this with a pioarduino URL: that platform needs a ~200 MB
; framework download which silently fails on some PCs and then crashes with
; "TypeError: argument should be a str or an os.PathLike ... NoneType".
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; larger app partition so the web UI + faces always fit
board_build.partitions = huge_app.csv
lib_deps =
    olikraus/U8g2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
